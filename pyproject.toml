[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastaction-ai"
version = "0.1.0"
description = "AI-powered API orchestration framework for connecting existing enterprise APIs to AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "FastAction Contributors"},
]
keywords = [
    "ai",
    "agents",
    "api-orchestration",
    "enterprise-ai",
    "llm",
    "tool-calling",
]
dependencies = [
    "fastapi>=0.109.0",
    "httpx>=0.26.0",
    "openai>=1.40.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
]
server = [
    "uvicorn[standard]>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fastaction"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

